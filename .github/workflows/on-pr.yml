name: Auto PR on PR

on:
  pull_request:
    branches: 
     - auto-pr/master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo ${{ github.event_name }}

      - name: Only when pull_request
        if: github.event_name == 'pull_request'
        run: echo ${{ github.ref_name }}

      - name: github.ref
        run: echo ${{ github.ref }}

      - name: github.base_ref
        run: echo ${{ github.base_ref }}
