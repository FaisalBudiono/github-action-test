name: Auto PR on PR

on:
  pull_request:
    branches:
      - auto-pr/master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        id: pr-info
        with:
          # result-encoding: string
          retries: 3
          script: |
            const resIssue = await github.rest.pulls.get({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            })

            return resIssue
      - run: |
          cat > script.txt<< EOF
          ${{ fromJSON(toJSON(steps.pr-info.outputs.result)) }}
          EOF
      - run: cat script.txt
