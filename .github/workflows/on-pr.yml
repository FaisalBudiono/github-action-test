name: Auto PR on PR

on:
  pull_request:
    branches: 
     - auto-pr/master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        id: pr-info
        with:
          # result-encoding: string
          retries: 3
          script: |
            const resIssue = await github.rest.issues.get({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            })

            return {
              body: resIssue.data.body,
              title: resIssue.data.title,
            }
      - run: |
          cat > script.txt<< EOF
          ${{ fromJSON(toJSON(steps.pr-info.outputs.result)) }}
          EOF
      - run: cat script.txt
      # - run: |
      #     echo ${{ fromJSON(steps.pr-info.outputs.result).body }}
      #     echo ${{ fromJSON(steps.pr-info.outputs.result).title }}

      - uses: actions/github-script@v7
        id: bawah
        with:
          retries: 3
          script: |
            return {
              asd: context.number
            }
      - run: |
          cat > script.txt<< EOF
          ${{ fromJSON(toJSON(steps.bawah.outputs.result)) }}
          EOF
      - run: cat script.txt
