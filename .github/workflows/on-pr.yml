name: Auto PR on PR

on:
  pull_request:
    branches: 
     - auto-pr/master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > event.txt<< EOF
          ${{ toJSON(github.event) }}
          EOF
      - run: cat event.txt
      - run: echo ${{ github.event.number }}
      - uses: actions/github-script@v7
        id: my-script
        with:
          # result-encoding: string
          retries: 3
          script: |
            const kuda = await github.rest.issues.get({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            })

            return kuda.data
      - run: |
          cat > script.txt<< EOF
          ${{ fromJSON(toJSON(steps.my-script.outputs.result)) }}
          EOF
      - run: cat script.txt
      - run: echo ${{ steps.my-script.outputs.result }}
